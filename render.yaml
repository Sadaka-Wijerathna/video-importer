services:
  - type: web
    name: video-importer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_API_ID
        sync: false          # set manually in Render dashboard
      - key: TELEGRAM_API_HASH
        sync: false
      - key: IMPORTER_API_SECRET
        sync: false          # shared secret with BuddyStore backend
      - key: PYTHON_VERSION
        value: 3.11.0
