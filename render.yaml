services:
  - type: web
    name: video-importer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: TELEGRAM_API_ID
        sync: false          # set manually in Render dashboard
      - key: TELEGRAM_API_HASH
        sync: false
      - key: IMPORTER_API_SECRET
        sync: false          # shared secret with BuddyStore backend
      - key: BUDDYSTORE_BACKEND_URL
        sync: false          # e.g. https://buddystore-backend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.0        # 3.12 uses less RAM than 3.11 — important on 512MB free tier
